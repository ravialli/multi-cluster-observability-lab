apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: prod-monitoring-observability
  namespace: flux-system
spec:
  interval: 5m
  path: ./apps/prod-monitoring
  prune: true
  wait: true
  timeout: 15m

  dependsOn:
    - name: prod-monitoring-platform

  sourceRef:
    kind: GitRepository
    name: flux-system
