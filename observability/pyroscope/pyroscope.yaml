apiVersion: v1
kind: ConfigMap
metadata:
  name: pyroscope-config
  namespace: observability
data:
  pyroscope.yaml: |
    server:
      http_listen_port: 4040
      log_level: info

    multitenancy_enabled: false

    architecture_storage: v2

    storage:
      backend: filesystem

      filesystem:
        dir: /tmp/pyroscope/shared

    metastore:
      data_dir: /tmp/pyroscope/metastore/data

      raft:
        dir: /tmp/pyroscope/metastore/raft

    self_profiling:
      disable_push: true

    analytics:
      reporting_enabled: false

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pyroscope
  namespace: observability
spec:
  replicas: 1

  selector:
    matchLabels:
      app: pyroscope

  template:
    metadata:
      labels:
        app: pyroscope

    spec:
      containers:
        - name: pyroscope
          image: grafana/pyroscope:2.2.0

          args:
            - -config.file=/etc/pyroscope/pyroscope.yaml
            - -target=all

          ports:
            - name: http
              containerPort: 4040

          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 15
            periodSeconds: 5

          resources:
            requests:
              cpu: 250m
              memory: 256Mi

            limits:
              memory: 1Gi

          volumeMounts:
            - name: config
              mountPath: /etc/pyroscope

            - name: data
              mountPath: /tmp/pyroscope

      volumes:
        - name: config
          configMap:
            name: pyroscope-config

        - name: data
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: pyroscope
  namespace: observability
spec:
  type: NodePort

  selector:
    app: pyroscope

  ports:
    - name: http
      port: 4040
      targetPort: http
      nodePort: 30440
