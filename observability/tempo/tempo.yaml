apiVersion: v1
kind: ConfigMap
metadata:
  name: tempo-config
  namespace: observability
data:
  tempo.yaml: |
    stream_over_http_enabled: true

    server:
      http_listen_port: 3200

    distributor:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: "0.0.0.0:4317"

            http:
              endpoint: "0.0.0.0:4318"

    storage:
      trace:
        backend: local

        wal:
          path: /tmp/tempo/wal

        local:
          path: /tmp/tempo/blocks

    usage_report:
      reporting_enabled: false

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tempo
  namespace: observability
spec:
  replicas: 1

  selector:
    matchLabels:
      app: tempo

  template:
    metadata:
      labels:
        app: tempo

    spec:
      containers:
        - name: tempo
          image: grafana/tempo:3.0.2

          args:
            - -config.file=/etc/tempo/tempo.yaml
            - -target=all

          ports:
            - name: http
              containerPort: 3200

            - name: otlp-grpc
              containerPort: 4317

            - name: otlp-http
              containerPort: 4318

          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5

          resources:
            requests:
              cpu: 250m
              memory: 512Mi

            limits:
              memory: 2Gi

          volumeMounts:
            - name: config
              mountPath: /etc/tempo

            - name: data
              mountPath: /tmp/tempo

      volumes:
        - name: config
          configMap:
            name: tempo-config

        - name: data
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: tempo
  namespace: observability
spec:
  type: NodePort

  selector:
    app: tempo

  ports:
    - name: http
      port: 3200
      targetPort: http
      nodePort: 32080

    - name: otlp-http
      port: 4318
      targetPort: otlp-http
      nodePort: 30418

    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
      nodePort: 30417
