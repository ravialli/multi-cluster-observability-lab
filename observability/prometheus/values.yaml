# Prometheus is the workload-cluster metrics scraper.
#
# Long-term storage will be handled by Mimir in a later stage.

alertmanager:
  enabled: false

prometheus-pushgateway:
  enabled: false

kube-state-metrics:
  enabled: true

prometheus-node-exporter:
  enabled: true

server:
  persistentVolume:
    enabled: false

  retention: "6h"

  remoteWrite:
    - url: http://monitoring-cluster-worker:30909/api/v1/push

  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      memory: 512Mi

  global:
    scrape_interval: 15s
    scrape_timeout: 10s
    evaluation_interval: 15s

    external_labels:
      cluster: workload-cluster
      environment: lab

extraScrapeConfigs: |
  - job_name: alloy
    scrape_interval: 15s

    static_configs:
      - targets:
          - alloy.observability.svc.cluster.local:12345

        labels:
          component: telemetry-gateway
          cluster: workload-cluster
