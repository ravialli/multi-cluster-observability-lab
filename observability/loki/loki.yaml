apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: observability
data:
  loki.yaml: |
    auth_enabled: false

    server:
      http_listen_port: 3100
      grpc_listen_port: 9096
      log_level: info

    distributor:
      otlp_config:
        default_resource_attributes_as_index_labels:
          - service.name
          - service.namespace
          - deployment.environment.name
          - k8s.cluster.name

    common:
      instance_addr: 127.0.0.1
      path_prefix: /tmp/loki

      storage:
        filesystem:
          chunks_directory: /tmp/loki/chunks
          rules_directory: /tmp/loki/rules

      replication_factor: 1

      ring:
        kvstore:
          store: inmemory

    query_range:
      results_cache:
        cache:
          embedded_cache:
            enabled: true
            max_size_mb: 50

    limits_config:
      allow_structured_metadata: true
      volume_enabled: true
      retention_period: 24h

    schema_config:
      configs:
        - from: "2024-04-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h

    compactor:
      working_directory: /tmp/loki/retention
      delete_request_store: filesystem
      retention_enabled: true

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: observability
spec:
  replicas: 1

  selector:
    matchLabels:
      app: loki

  template:
    metadata:
      labels:
        app: loki

    spec:
      containers:
        - name: loki
          image: grafana/loki:3.7.6

          args:
            - -config.file=/etc/loki/loki.yaml

          ports:
            - name: http
              containerPort: 3100

            - name: grpc
              containerPort: 9096

          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5

          resources:
            requests:
              cpu: 100m
              memory: 128Mi

            limits:
              memory: 512Mi

          volumeMounts:
            - name: config
              mountPath: /etc/loki

            - name: data
              mountPath: /tmp/loki

      volumes:
        - name: config
          configMap:
            name: loki-config

        - name: data
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: observability
spec:
  type: NodePort

  selector:
    app: loki

  ports:
    - name: http
      port: 3100
      targetPort: http
      nodePort: 31080
