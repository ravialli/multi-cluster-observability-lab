apiVersion: v1
kind: Namespace
metadata:
  name: observability

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mimir-config
  namespace: observability
data:
  mimir.yaml: |
    # Local development configuration.
    # Filesystem storage is intentionally used for this Kind lab.

    multitenancy_enabled: false

    usage_stats:
      enabled: false

    limits:
      promote_otel_resource_attributes: "k8s.cluster.name,deployment.environment.name,service.version,service.criticality"

    blocks_storage:
      backend: filesystem

      bucket_store:
        sync_dir: /tmp/mimir/tsdb-sync

      filesystem:
        dir: /tmp/mimir/data/tsdb

      tsdb:
        dir: /tmp/mimir/tsdb

    compactor:
      data_dir: /tmp/mimir/compactor

      sharding_ring:
        kvstore:
          store: memberlist

    distributor:
      ring:
        instance_addr: 127.0.0.1

        kvstore:
          store: memberlist

    ingester:
      ring:
        instance_addr: 127.0.0.1

        kvstore:
          store: memberlist

        replication_factor: 1

    ruler_storage:
      backend: filesystem

      filesystem:
        dir: /tmp/mimir/rules

    server:
      http_listen_port: 9009
      log_level: info

    store_gateway:
      sharding_ring:
        replication_factor: 1

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mimir
  namespace: observability
spec:
  replicas: 1

  selector:
    matchLabels:
      app: mimir

  template:
    metadata:
      labels:
        app: mimir

    spec:
      containers:
        - name: mimir
          image: grafana/mimir:3.1.4

          args:
            - -config.file=/etc/mimir/mimir.yaml
            - -target=all

          ports:
            - name: http
              containerPort: 9009

          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5

          resources:
            requests:
              cpu: 200m
              memory: 256Mi

            limits:
              memory: 768Mi

          volumeMounts:
            - name: config
              mountPath: /etc/mimir

            - name: data
              mountPath: /tmp/mimir

      volumes:
        - name: config
          configMap:
            name: mimir-config

        - name: data
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: mimir
  namespace: observability
spec:
  type: NodePort

  selector:
    app: mimir

  ports:
    - name: http
      port: 9009
      targetPort: http
      nodePort: 30909
