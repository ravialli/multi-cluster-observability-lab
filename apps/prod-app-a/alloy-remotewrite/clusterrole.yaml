apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: alloy-remotewrite
rules:
  # Kubernetes discovery
  - apiGroups: [""]
    resources:
      - pods
      - services
      - endpoints
      - namespaces
    verbs:
      - get
      - list
      - watch

  # EndpointSlice discovery
  - apiGroups: ["discovery.k8s.io"]
    resources:
      - endpointslices
    verbs:
      - get
      - list
      - watch

  # Node discovery
  - apiGroups: [""]
    resources:
      - nodes
    verbs:
      - get
      - list
      - watch

  # Required by Alloy kubelet discovery
  - apiGroups: [""]
    resources:
      - nodes/pods
    verbs:
      - get
      - list
      - watch

  # Kubelet and cAdvisor metrics
  - apiGroups: [""]
    resources:
      - nodes/metrics
    verbs:
      - get