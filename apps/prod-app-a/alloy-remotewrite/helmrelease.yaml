apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy-remotewrite
  namespace: observability

spec:
  interval: 10m
  timeout: 15m

  install:
    remediation:
      retries: 2
  chart:
    spec:
      chart: alloy
      version: 1.11.1
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
  values:
    rbac:
      create: false
    serviceAccount:
      create: false
      name: alloy-remotewrite
    controller:
      type: daemonset
      tolerations:
        - key: cloud.google.com/gke-spot
          operator: Equal
          value: "true"
          effect: NoSchedule
    alloy:
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
      