apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: otel-demo
  namespace: otel-demo
spec:
  interval: 10m
  timeout: 15m
  install:
    remediation:
      retries: 2
  chart:
    spec:
      chart: opentelemetry-demo
      version: 0.41.0
      sourceRef:
        kind: HelmRepository
        name: open-telemetry-repository 
        namespace: flux-system
        
  values:
    default:
      schedulingRules:
        nodeSelector:
          cloud.google.com/gke-spot: "true"
        tolerations:
          - key: "cloud.google.com/gke-spot"
            operator: "Equal"
            value: "true"
            effect: "NoSchedule"
    grafana:
      enabled: false
    prometheus:
      enabled: false
    jaeger:
      enabled: false
    opensearch:
      enabled: false
    opentelemetry-collector:
      nodeSelector:
        cloud.google.com/gke-spot: "true"

      tolerations:
        - key: "cloud.google.com/gke-spot"
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"
