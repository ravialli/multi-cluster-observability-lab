apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: otel-demo
  namespace: otel-demo

spec:
  interval: 10m
  timeout: 15m

  install:
    remediation:
      retries: 2
  chart:
    spec:
      chart: opentelemetry-demo
      version: 0.41.0
      sourceRef:
        kind: HelmRepository
        name: open-telemetry-repository
        namespace: flux-system
  values:
    default:
      schedulingRules:
        nodeSelector:
          cloud.google.com/gke-spot: "true"
        tolerations:
          - key: "cloud.google.com/gke-spot"
            operator: "Equal"
            value: "true"
            effect: "NoSchedule"
    grafana:
      enabled: false
    prometheus:
      enabled: false
    jaeger:
      enabled: false
    opensearch:
      enabled: false
    opentelemetry-collector:
      nodeSelector:
        cloud.google.com/gke-spot: "true"

      tolerations:
        - key: "cloud.google.com/gke-spot"
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"

      resources:
        limits:
          memory: 600Mi
      alternateConfig:
        receivers:

          otlp:
            protocols:

              grpc:
                endpoint: ${env:MY_POD_IP}:4317

              http:
                endpoint: ${env:MY_POD_IP}:4318

                cors:
                  allowed_origins:
                    - "http://*"
                    - "https://*"

                  allowed_headers:
                    - content-type
                    - traceparent
                    - baggage
          kafkametrics:
            brokers:
              - kafka:9092

            collection_interval: 10s

            scrapers:
              - brokers
              - topics
              - consumers
          prometheus/ad:
            config:
              scrape_configs:
                - job_name: ad
                  scrape_interval: 10s

                  static_configs:
                    - targets:
                        - ad:9465

        processors:

          memory_limiter:
            check_interval: 5s
            limit_percentage: 80
            spike_limit_percentage: 25

          resourcedetection:
            detectors:
              - env
              - system

          resource:
            attributes:
              - key: service.instance.id
                from_attribute: k8s.pod.uid
                action: insert

          transform/sanitize_spans:
            error_mode: ignore

            trace_statements:

              - context: span

                conditions:
                  - >
                    span.kind == SPAN_KIND_SERVER
                    and resource.attributes["service.name"] == "frontend"
                    and span.attributes["http.route"] == nil

                statements:
                  - >
                    set(
                      span.attributes["http.route"],
                      "/api/cart"
                    )
                    where IsMatch(
                      span.attributes["http.target"],
                      "\\/api\\/cart"
                    )

                  - >
                    set(
                      span.attributes["http.route"],
                      "/api/checkout"
                    )
                    where IsMatch(
                      span.attributes["http.target"],
                      "\\/api\\/checkout"
                    )

                  - >
                    set(
                      span.attributes["http.route"],
                      "/api/products/{productId}"
                    )
                    where IsMatch(
                      span.attributes["http.target"],
                      "\\/api\\/products\\/.*"
                    )

                  - >
                    set(
                      span.attributes["http.route"],
                      "/api/recommendations"
                    )
                    where IsMatch(
                      span.attributes["http.target"],
                      "\\/api\\/recommendations"
                    )

                  - >
                    set(
                      span.attributes["http.route"],
                      "/api/data"
                    )
                    where IsMatch(
                      span.attributes["http.target"],
                      "\\/api\\/data.*"
                    )

              - context: span

                statements:
                  - >
                    set_semconv_span_name(
                      "1.37.0",
                      "unsanitized_span_name"
                    )

          transform/sanitize_logs:
            error_mode: ignore

            log_statements:

              - context: scope

                statements:

                  - >
                    set(
                      attributes["otelcol_signal"],
                      attributes["otelcol.signal"]
                    )
                    where
                    attributes["otelcol.signal"] != nil
                    and not IsMap(
                      attributes["otelcol.signal"]
                    )

                  - >
                    delete_key(
                      attributes,
                      "otelcol.signal"
                    )
                    where
                    attributes["otelcol_signal"] != nil

          gen_ai_normalizer:
            sources:
              - name: openllmetry

          filter/sanitize_profiles:
            error_mode: ignore

            profiles:
              profile:
                - >
                  IsMatch(
                    resource.attributes["service.name"],
                    "containerd-shim-.*"
                  )

        connectors:
          span_metrics: {}
        exporters:
          debug: {}
          otlp_grpc/tempo:
            endpoint: "10.40.0.13:4317"

            tls:
              insecure: true

            sending_queue:
              batch: {}

          otlp_http/mimir:
            endpoint: "http://10.40.0.14/otlp"

            sending_queue:
              batch: {}

        extensions:

          health_check:
            endpoint: ${env:MY_POD_IP}:13133

          opamp:

            server:
              ws:
                endpoint: ws://opamp-server:4320/v1/opamp

            instance_uid: 00000000-0000-7000-8000-000000000001

            capabilities:
              reports_effective_config: true
              reports_health: true
              reports_available_components: true

            agent_description:
              include_resource_attributes: true

              non_identifying_attributes:
                deployment.environment.name: demo
                demo.collector.role: gateway

        service:

          extensions:
            - health_check
            - opamp

          pipelines:
            traces:

              receivers:
                - otlp

              processors:
                - memory_limiter
                - resourcedetection
                - resource
                - transform/sanitize_spans
                - gen_ai_normalizer

              exporters:
                - otlp_grpc/tempo
                - span_metrics
                - debug
            metrics:
              receivers:
                - otlp
                - kafkametrics
                - span_metrics
                - prometheus/ad

              processors:
                - memory_limiter
                - resourcedetection
                - resource

              exporters:
                - otlp_http/mimir
                - debug
            logs:

              receivers:
                - otlp

              processors:
                - memory_limiter
                - resourcedetection
                - resource
                - transform/sanitize_logs

              exporters:
                - debug

            profiles:

              receivers:
                - otlp

              processors:
                - memory_limiter
                - resourcedetection
                - resource
                - filter/sanitize_profiles

              exporters:
                - debug
          telemetry:

            resource:
              host.name: ${env:OTEL_K8S_NODE_NAME}
              k8s.namespace.name: ${env:OTEL_K8S_NAMESPACE}
              k8s.node.ip: ${env:OTEL_K8S_NODE_IP}
              k8s.node.name: ${env:OTEL_K8S_NODE_NAME}
              k8s.pod.ip: ${env:OTEL_K8S_POD_IP}
              k8s.pod.name: ${env:OTEL_K8S_POD_NAME}