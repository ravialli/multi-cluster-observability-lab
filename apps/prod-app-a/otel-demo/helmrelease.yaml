apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: otel-demo
  namespace: otel-demo
spec:
  interval: 10m
  timeout: 15m
  install:
    remediation:
      retries: 2
  chart:
    spec:
      chart: opentelemetry-demo
      version: 0.41.0
      sourceRef:
        kind: HelmRepository
        name: open-telemetry-repository 
        namespace: flux-system
        
  values:
    default:
      schedulingRules:
        nodeSelector:
          cloud.google.com/gke-spot: "true"
        tolerations:
          - key: "cloud.google.com/gke-spot"
            operator: "Equal"
            value: "true"
            effect: "NoSchedule"
    grafana:
      enabled: false
    prometheus:
      enabled: false
    jaeger:
      enabled: false
    opensearch:
      enabled: false
    opentelemetry-collector:
      config:
        exporters:
          otlp_http/mimir:
            endpoint: "http://10.40.0.14/otlp"
            tls:
              insecure: true
          otlp_grpc/tempo:
            endpoint: 10.40.0.13:4317
            tls:
              insecure: true
        service:
          pipelines:
            traces:
              exporters:
                - otlp_grpc/tempo
                - debug
                - span_metrics
            metrics:
              exporters:
                - otlp_http/mimir
                - debug
            logs:
              exporters:
                - debug

            profiles:
              exporters:
                - debug
      nodeSelector:
        cloud.google.com/gke-spot: "true"

      tolerations:
        - key: "cloud.google.com/gke-spot"
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"
