apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: grafana

resources:
  - helmrelease.yaml

configMapGenerator:
  - name: prod-app-a-overview-dashboard
    files:
      - dashboards/prod-app-a-overview.json

generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"